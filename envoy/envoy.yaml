# Envoy gRPC-JSON transcoder in front of the C++ quotes_server.
# REST on :8080  ->  gRPC (HTTP/2 cleartext) on 127.0.0.1:50051.
# Field names checked against Envoy v1.39 (image tag pinned in scripts/run-envoy.sh).
static_resources:
  listeners:
  - name: rest
    address:
      socket_address: { address: 0.0.0.0, port_value: 8080 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: rest
          codec_type: AUTO
          route_config:
            name: local
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              # Transcoded requests arrive here already rewritten to
              # POST /quotes.v1.Quotes/<Method>, so match the gRPC prefix.
              - match: { prefix: "/quotes.v1.Quotes/" }
                route: { cluster: grpc_backend, timeout: 10s }
          http_filters:
          - name: envoy.filters.http.grpc_json_transcoder
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
              # Built by scripts/gen.sh (protoc --include_imports --descriptor_set_out).
              proto_descriptor: /etc/envoy/proto.pb
              # A name missing from the descriptor stops Envoy at startup.
              services: ["quotes.v1.Quotes"]
              # Put the gRPC status message into the JSON error body.
              convert_grpc_status: true
              print_options:
                add_whitespace: false
                always_print_primitive_fields: true
              # Default is to pass malformed requests through silently.
              request_validation_options:
                reject_unknown_method: true            # unmapped path -> 404
                reject_unknown_query_parameters: true  # ?bogus=1      -> 400
                reject_binding_body_field_collisions: true
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: grpc_backend
    type: STATIC
    connect_timeout: 1s
    lb_policy: ROUND_ROBIN
    # The upstream must speak HTTP/2 (gRPC).
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: grpc_backend
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 50051 }
